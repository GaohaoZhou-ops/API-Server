name: Platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: echo "API_DOCS_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: npm run audit:public -- --history
      - run: npm run docs:check -- examples/hello-docs
      - run: npm test
